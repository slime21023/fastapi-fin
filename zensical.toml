[project]
site_name = "FastAPI-Fin"
site_description = "Contract-first dishka dependency injection for FastAPI."
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/slime21023/fastapi-fin"
repo_name = "slime21023/fastapi-fin"
edit_uri = "edit/main/docs/"
nav = [
  { "首頁" = "index.md" },
  { "開始使用" = [
    { "安裝與第一個 App" = "guide/getting-started.md" },
    { "核心概念" = "guide/concepts.md" },
  ] },
  { "功能指南" = [
    { "模組契約" = "guide/modules.md" },
    { "FastAPI 整合" = "guide/fastapi.md" },
    { "作用域與資源管理" = "guide/scopes.md" },
    { "Security 與 JWT" = "guide/security.md" },
    { "測試" = "guide/testing.md" },
  ] },
  { "API 參考" = [
    { "API 一覽" = "reference/index.md" },
    { "Modules 與 Container" = "reference/modules.md" },
    { "FastAPI 整合" = "reference/fastapi.md" },
    { "Security 與 JWT" = "reference/security.md" },
    { "Errors" = "reference/errors.md" },
  ] },
  { "範例" = "examples/index.md" },
]

[project.theme]
language = "zh-TW"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.action.view",
  "content.action.edit",
]
