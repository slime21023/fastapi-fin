[project]
site_name = "FastAPI-Fin"
site_description = "Contract-first dishka dependency injection for FastAPI."
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/slime21023/fastapi-fin"
repo_name = "slime21023/fastapi-fin"
edit_uri = "edit/main/docs/"
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Installation and your first app" = "guide/getting-started.md" },
    { "Core concepts" = "guide/concepts.md" },
  ] },
  { "Guides" = [
    { "Modules and contracts" = "guide/modules.md" },
    { "FastAPI integration" = "guide/fastapi.md" },
    { "Scopes and cleanup" = "guide/scopes.md" },
    { "Running with Uvicorn" = "guide/deployment.md" },
    { "Security and JWT" = "guide/security.md" },
    { "Testing and overrides" = "guide/testing.md" },
  ] },
  { "API reference" = [
    { "Overview" = "reference/index.md" },
    { "Modules and container" = "reference/modules.md" },
    { "FastAPI integration" = "reference/fastapi.md" },
    { "Security and JWT" = "reference/security.md" },
    { "Errors" = "reference/errors.md" },
  ] },
  { "Examples" = "examples/index.md" },
]

[project.theme]
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.action.view",
  "content.action.edit",
]
