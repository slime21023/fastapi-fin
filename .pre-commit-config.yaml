repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types: [python]

      - id: ty
        name: ty (type check)
        entry: uv run ty check
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest-fast
        name: pytest (fast tests only)
        entry: uv run pytest -m "not integration" -q
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]
