[project]
name = "fastapi-fin"
version = "0.9.1"
description = "Contract-first dishka dependency injection for FastAPI."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "slime21023" }]
keywords = ["fastapi", "dishka", "dependency-injection", "contract", "modules"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "attrs>=25.4,<27",
    "dishka>=1.10.1,<2",
    "fastapi>=0.115.11",
]

[project.urls]
Homepage = "https://github.com/slime21023/fastapi-fin"
Repository = "https://github.com/slime21023/fastapi-fin"
Issues = "https://github.com/slime21023/fastapi-fin/issues"
Changelog = "https://github.com/slime21023/fastapi-fin/blob/main/CHANGELOG.md"

[project.optional-dependencies]
security = [
    "PyJWT[crypto]>=2.10,<3",
]

[dependency-groups]
dev = [
    "bandit>=1.7",
    "httpx>=0.28.1",
    "httpx2>=2",
    "PyJWT[crypto]>=2.10,<3",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pip-audit>=2.7",
    "uvicorn>=0.24",
    "ruff>=0.11",
    "ty>=0.0.1",
    "zensical>=0.0.52",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.agents",
    "/.github",
    "/.gitattributes",
    "/.pre-commit-config.yaml",
    "/skills-lock.json",
    "/uv.lock",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["fastapi_fin", "tests"]
extend-exclude = ["build", "dist", ".venv", ".agents"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "C4", "C90", "D", "E", "ERA", "F",
    "FURB", "I", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "RET",
    "RSE", "RUF", "S", "SIM", "SLOT", "T20", "TC", "UP", "W",
]
ignore = ["D105"] # Special methods are documented by their enclosing class.

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004", "S101"]
"tests/integration/*.py" = ["S603", "S607"]
"tests/unit/security/test_jwt.py" = ["ANN401", "S105", "S106"]
"tests/unit/test_modules.py" = ["ANN401"]
"examples/**/*.py" = ["D", "PLR2004", "S101", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["fastapi_fin"]
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"
python = "./.venv"

[tool.ty.src]
include = ["fastapi_fin", "tests", "examples"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "integration: marks tests requiring external services or a running application",
]
